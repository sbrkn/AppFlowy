<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline – AppFlowy</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: #f8fafc;
        color: #334155;
      }
      .card {
        text-align: center;
        padding: 2rem;
        max-width: 400px;
      }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      p { color: #64748b; margin-bottom: 1.5rem; }
      button {
        background: #6366f1;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover { background: #4f46e5; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>No internet connection detected. Your changes will sync when you reconnect.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
